name: zyker-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: zyker-app
    environment:
      PHX_BIND_ALL: "true"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "127.0.0.1:${APP_PORT}:4000"
    volumes:
      - .:/app
      - deps:/app/deps
      - build:/app/_build
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  db:
    image: postgres:17.10
    container_name: zyker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: zyker-seaweedfs
    command: server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3
    environment:
      # SeaweedFS turns these into an admin S3 identity at startup.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${S3_PORT}:8333"
      - "127.0.0.1:${SEAWEEDFS_MASTER_PORT}:9333"
      - "127.0.0.1:${SEAWEEDFS_FILER_PORT}:8888"
    volumes:
      - seaweed:/data

volumes:
  deps:
  build:
  pgdata:
  seaweed:
